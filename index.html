<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎈</title><meta name="description" content="Happy Birthday, Tanisha! 🎂"><meta name="color-scheme" content="light"><meta name="format-detection" content="telephone=no"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎂%3C/text%3E%3C/svg%3E"><meta name="theme-color" content="#ffd9ec">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Caveat:wght@500;600&family=Dancing+Script:wght@600;700&family=Hind+Siliguri:wght@400;500;600&family=Galada&family=Atma:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>

<section id="intro">
  <div class="hang"><div class="string"></div><div class="pin">🎀</div>
    <div class="tag"><small>FOR</small><h1 class="cute" id="iname"></h1><p id="ifrom"></p></div>
  </div>
  <div class="hint" id="ihint"></div>
</section>

<section id="main">
  <div class="cake">🎂</div>
  <h2 class="cute" id="title"></h2>
  <p class="sub" id="sub"></p>
  <h3 class="script shine" id="trt"></h3><div class="chips" id="chips"></div>
  <div id="sky"></div><div id="wish"></div><div class="cnt" id="cnt"></div>
  <h3 class="script shine" id="mt"></h3><div class="gal" id="gal"></div>
  <div class="cta"><span class="ico">💌</span><button class="btn" id="lbtn"></button><br><button class="again" id="again"></button></div>
  <footer id="foot"></footer>
</section>

<section id="letter">
  <div id="stage">
    <div class="env" id="env"><div class="back"></div><div class="card" id="card">💌</div><div class="front"></div><div class="flap"></div><div class="seal">⭐</div><div class="to script" id="to"></div></div>
    <div class="hint" id="hint"></div>
  </div>
  <div id="paperWrap"><div class="paper" id="paper"></div><div class="acts" id="acts"><button class="btn" id="back"></button></div></div>
</section>
<button class="skip" id="skip"></button>

<div id="lb"><button class="x">✕</button><button class="p">‹</button><img id="lbi" alt=""><div class="cap" id="lbc"></div><button class="n">›</button></div>

<script src="config.js"></script>
<script src="main.js"></script>
</body></html>
